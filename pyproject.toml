[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-shortcut"
version = "0.1.0"
description = "Local Windows voice dictation from a global hotkey"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.1.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "PySide6>=6.8",
    "pynput>=1.7.7",
    "pyperclip>=1.9",
    "sounddevice>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pyinstaller>=6.11",
    "pytest>=8.3,<9",
    "ruff>=0.9",
]

[project.scripts]
whisper-shortcut = "whisper_shortcut.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
